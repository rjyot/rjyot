<svg xmlns="http://www.w3.org/2000/svg" width="260" height="300" viewBox="0 0 260 300" role="img" aria-label="Animated pour-over coffee dripping into a cup">
<style>
.drop{animation:d 1.4s linear infinite;opacity:0}.d2{animation-delay:.47s}.d3{animation-delay:.94s}
@keyframes d{0%{opacity:0;transform:translateY(0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(78px)}}
.fill{animation:f 6s ease-in-out infinite alternate;transform-origin:130px 262px}
@keyframes f{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.steam{animation:s 3s ease-in-out infinite;opacity:0}.s2{animation-delay:1.5s}
@keyframes s{0%{opacity:0;transform:translateY(8px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-18px)}}
</style>
